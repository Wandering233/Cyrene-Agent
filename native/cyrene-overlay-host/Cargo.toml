[package]
name = "cyrene-overlay-host"
version = "0.1.0"
edition = "2024"
description = "Wayland overlay host for Cyrene pet/toast windows"

[dependencies]
anyhow = "1"
calloop = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.20", features = ["calloop"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
