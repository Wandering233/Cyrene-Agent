name: Linux / Wayland

on:
  push:
    branches: [cyreneOnHyprland]
  pull_request:
    branches: [cyreneOnHyprland]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:main
      - run: pnpm run check:preload
      - run: pnpm run check:renderer
      - run: pnpm test
      - run: pnpm run test:linux-artifacts

  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path native/cyrene-overlay-host/Cargo.toml
      - run: cargo build --release --manifest-path native/cyrene-overlay-host/Cargo.toml
      - run: node scripts/build/overlay-host.mjs
      - run: |
          test -x native/cyrene-overlay-host/target/release/cyrene-overlay-host
          test -x native/cyrene-overlay-host/target/release/cyrene-overlay-fullscreen
          cd resources/bin/linux && sha256sum -c SHA256SUMS
